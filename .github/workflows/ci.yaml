name: CI

# Lightweight fork CI: lint + typecheck + JS tests + core Python test suite.
# No E2E, no desktop, no docker, no bootstrap installer.
#
# Sub-workflows are triggered via workflow_call and keep their own job
# definitions. This file is the orchestrator.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (ruff + ty)
    uses: ./.github/workflows/lint.yml
    with:
      event_name: ${{ github.event_name }}

  js-tests:
    name: JS & TS checks
    uses: ./.github/workflows/js-tests.yml

  tests:
    name: Python tests
    uses: ./.github/workflows/tests.yml
    with:
      e2e: false
      e2e_upgrade: false

  all-checks-pass:
    name: All required checks pass
    needs:
      - lint
      - js-tests
      - tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate job results
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "js-tests=${{ needs.js-tests.result }}"
          echo "tests=${{ needs.tests.result }}"
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.js-tests.result }}" != "success" ] || \
             [ "${{ needs.tests.result }}" != "success" ]; then
            echo "::error::One or more required checks failed"
            exit 1
          fi
          echo "All checks passed"
