name: JS Tests

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: js-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: JS & TS checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - name: Set up the locked JS build toolchain
        id: node
        uses: ./.github/actions/setup-pm
        with:
          toolchain: node
          cache-node: true

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: npm ci

      - name: Run all workspace checks
        run: node .github/scripts/run-workspace-checks.mjs
